<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CodeAtlas</title>
<script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.4.0/cytoscape-dagre.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  #cy { width: 100vw; height: 100vh; }
  header { padding: 12px 16px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header>
  <strong>CodeAtlas</strong>
  <p>Owns 0 symbols across 0 file(s).</p>
</header>
<div id="cy"></div>
<script>
const data = {"nodes": [{"data": {"id": "contextfold_cli", "label": "contextfold-cli", "description": "Owns 0 symbols across 1 file(s).", "linkUrl": "./contextfold_cli.html"}}, {"data": {"id": "contextfold_core", "label": "contextfold-core", "description": "Owns 0 symbols across 1 file(s).", "linkUrl": "./contextfold_core.html"}}, {"data": {"id": "contextfold_parsers", "label": "contextfold-parsers", "description": "Owns 0 symbols across 1 file(s).", "linkUrl": "./contextfold_parsers.html"}}, {"data": {"id": "contextfold_py", "label": "contextfold-py", "description": "Owns 0 symbols across 1 file(s).", "linkUrl": "./contextfold_py.html"}}], "edges": [{"data": {"id": "edge_0", "source": "contextfold_cli", "target": "contextfold_core", "label": "calls"}}, {"data": {"id": "edge_1", "source": "contextfold_cli", "target": "contextfold_parsers", "label": "calls"}}, {"data": {"id": "edge_2", "source": "contextfold_core", "target": "contextfold_parsers", "label": "calls"}}, {"data": {"id": "edge_3", "source": "contextfold_parsers", "target": "contextfold_core", "label": "calls"}}, {"data": {"id": "edge_4", "source": "contextfold_py", "target": "contextfold_core", "label": "calls"}}, {"data": {"id": "edge_5", "source": "contextfold_py", "target": "contextfold_parsers", "label": "calls"}}]};
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: data,
  style: [
    { selector: 'node', style: {
      'label': 'data(label)',
      'shape': 'round-rectangle',
      'background-color': '#eef2ff',
      'border-color': '#6366f1',
      'border-width': 1,
      'width': 'label',
      'padding': '10px',
      'text-valign': 'center',
      'text-halign': 'center',
      'font-size': '12px',
    }},
    { selector: 'edge', style: {
      'label': 'data(label)',
      'curve-style': 'bezier',
      'target-arrow-shape': 'triangle',
      'font-size': '10px',
      'text-rotation': 'autorotate',
    }}
  ],
  layout: { name: 'dagre', rankDir: 'LR' }
});
cy.on('tap', 'node', evt => {
  const node = evt.target;
  if (node.data('linkUrl')) { window.location.href = node.data('linkUrl'); }
});
</script>
</body>
</html>
