[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pycontextfold"
dynamic = ["version"]
description = "Structure-aware context optimization for LLM consumption. Shrink source code, documentation, logs and structured text before sending them to an LLM. Typed Python API with a fast, deterministic Rust core, Tree-sitter parsing, conservative profiles, preservation policies, budget-aware folding and transformation reports."
readme = "README.md"
requires-python = ">=3.10"

authors = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
license = "Apache-2.0"
keywords = [
    "llm", "context", "compression", "tree-sitter", "token-budget",
    "code-analysis", "local-first", "rust", "pyo3", "context-optimization",
    "prompt-engineering", "log-reduction", "markdown"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
pycontextfold-bench = "pycontextfold.bench.cli:main"

[project.urls]
Homepage = "https://github.com/Mullassery/PyContextFold"
Documentation = "https://github.com/Mullassery/PyContextFold/blob/main/README.md"
Repository = "https://github.com/Mullassery/PyContextFold.git"
Issues = "https://github.com/Mullassery/PyContextFold/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "maturin>=1.0", "ruff>=0.5.0"]
# Optional ecosystem extras: each maps to a sibling project and activates one or
# more benchmark adapters. All are optional — the core and the offline benchmark
# run with none of them installed. Install the ones whose projects are reachable
# from your package index.
tokens = ["pytokencalc"]
tiktoken = ["tiktoken>=0.5"]
hf = ["transformers>=4.40"]
pdf = ["pystreampdf"]
agents = ["pyagenthound"]
api = ["pyapicheck"]
retrieval = ["pyvectorhound"]
inference = ["pyinferencemanager", "pystreamai"]
middleware = ["openanchor"]
discovery = ["pystreammcp"]
ecosystem = [
    "pytokencalc",
    "pystreampdf",
    "pyagenthound",
    "pyapicheck",
    "pyvectorhound",
    "pyinferencemanager",
    "pystreamai",
    "openanchor",
    "pystreammcp",
]

[tool.maturin]
python-source = "src"
module-name = "pycontextfold._core"
manifest-path = "crates/contextfold-py/Cargo.toml"
include = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "optional: requires a real (optional) ecosystem package to be installed",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["tests/fixtures"]
